<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció</title>

    <!-- Bootstrap CSS only -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
</head>

<body>
    <main class="container py-4">

        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-6">
                <h2 class="h4 text-center mb-4">Regisztráció</h2>

                <form>
                    <div class="row align-items-center mb-3">
                        
                        <label for="nev" class="col-4 col-form-label">Név:</label>
                        <div class="col-8">
                            <input type="text" class="form-control" id="nev" maxlength="255">
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <label for="felhasznalonev" class="col-4 col-form-label">felhasználó:</label>
                        <div class="col-8">
                            <input type="text" class="form-control" id="felhasznalonev" maxlength="100">
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <label for="jelszo" class="col-4 col-form-label">jelszó:</label>
                        <div class="col-8">
                            <input type="password" class="form-control" id="jelszo" maxlength="25">
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <label for="szerepkor" class="col-4 col-form-label">szerepkör:</label>
                        <div class="col-8">
                            <select class="form-select" id="szerepkor">
                                <option>Felhasználó</option>
                                <option>admin</option>
                                <option>karbantartó</option>
                            </select>
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <div class="col-4">autó:</div>
                        <div class="col-8">
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="auto" id="auto-van" value="van" checked>
                                    <label class="form-check-label" for="auto-van">van</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="auto" id="auto-nincs" value="nincs">
                                    <label class="form-check-label" for="auto-nincs">nincs</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <div class="col-4">PC:</div>
                        <div class="col-8">
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="szamitogep" id="pc-van" value="van">
                                    <label class="form-check-label" for="pc-van">van</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="szamitogep" id="pc-nincs" value="nincs">
                                    <label class="form-check-label" for="pc-nincs">nincs</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row align-items-center mb-3">
                        <label for="mobil" class="col-4 col-form-label">mobil:</label>
                        <div class="col-8">
                            <input type="tel" class="form-control" id="mobil" maxlength="255">
                        </div>
                    </div>

                    <div class="row align-items-center mb-4">
                        <label for="email" class="col-4 col-form-label">email:</label>
                        <div class="col-8">
                            <input type="email" class="form-control" id="email" maxlength="255">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-4"></div>
                        <div class="col-8 d-flex gap-2">
                            <button type="button" onclick="validate()" class="btn btn-outline-secondary">Küldés</button>
                            <button type="reset" class="btn btn-outline-secondary">Mégsem</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
<script src="main.js"></script>
</html>
